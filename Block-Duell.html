/* Kisten-Modelle */
.chm{position:relative;width:var(--chs,96px);height:var(--chs,96px);margin:0 auto 6px;display:grid;place-items:center;isolation:isolate}
.chm>svg.px{position:relative;z-index:3;width:92%;height:auto;transform-origin:50% 62%}
.chm>i{position:absolute;display:block;pointer-events:none}
.chm .ch-gl{z-index:0;inset:-14%;border-radius:50%;background:radial-gradient(circle,var(--tc) 0,transparent 68%);opacity:.5;animation:chPulse 2.6s ease-in-out infinite alternate}
.chm .ch-hl{z-index:2;inset:4%;border-radius:50%;border:2px solid var(--tc);opacity:.55;animation:chPulse 1.5s ease-in-out infinite alternate;box-shadow:0 0 16px var(--tc)}
.chm .ch-pt{z-index:1;width:6px;height:6px;border-radius:1px;background:var(--tc);left:calc(10% + var(--i,0)*13%);bottom:16%;opacity:0;animation:chUp 1.7s linear infinite;animation-delay:calc(var(--i,0)*-0.26s)}
@keyframes chPulse{from{opacity:.36;transform:scale(.95)}to{opacity:.72;transform:scale(1.08)}}
@keyframes chUp{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-46px) scale(.2)}}
@keyframes chSpin{to{transform:rotate(360deg)}}
@keyframes chTwinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
.pc .chm{--chs:102px}.cs1 .chm{--chs:104px}
.chm.vc .ch-bh{z-index:0;inset:-12%;border-radius:50%;background:radial-gradient(circle,#000 0 26%,#150025 34%,#3d0a6b 42%,#7a2cff 47%,#3d0a6b55 56%,transparent 66%);box-shadow:0 0 34px #7a2cff,inset 0 0 18px #000;animation:chSpin 9s linear infinite}
.chm.vc .ch-bh::after{content:'';position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8%,#c9a6ff 18%,#7a2cff 30%,transparent 44%,#e8d8ff 58%,transparent 72%,#8a4bff 86%,transparent);filter:blur(3px);animation:chSpin 2.6s linear infinite reverse;opacity:.9}
.chm.vc>svg.px{width:86%;height:86%;animation:chSuck 3.8s ease-in-out infinite;filter:drop-shadow(0 0 6px #7a2cff) drop-shadow(0 0 16px #3d0a6b)}

@keyframes chSuckP{0%{opacity:0;transform:translate(0,-10px) scale(1)}30%{opacity:1}100%{opacity:0;transform:translate(-18px,22px) scale(.1)}}
.chm.fc .ch-fl{z-index:1;left:-10%;right:-10%;bottom:-2%;height:72%;background:radial-gradient(45% 62% at 30% 100%,#ffe9a0 0,#ffb020 34%,#ff7a1a 58%,transparent 76%),radial-gradient(42% 66% at 70% 100%,#ff7a1a 0,#e8383d 52%,transparent 78%),radial-gradient(38% 52% at 50% 100%,#fff6c0 0,#ffd83a 40%,transparent 72%);filter:blur(1.4px);opacity:.85;animation:chFlame .48s ease-in-out infinite alternate}
.chm.fc .ch-fl2{z-index:4;left:4%;right:4%;bottom:-4%;height:46%;background:radial-gradient(50% 70% at 38% 100%,#ffe9a0 0,#ffb020 42%,transparent 74%),radial-gradient(48% 76% at 64% 100%,#ff9a2a 0,#e8383d 52%,transparent 80%);filter:blur(1px);opacity:.92;mix-blend-mode:screen;animation:chFlame .36s ease-in-out infinite alternate-reverse}

.chm.fc .ch-t2{left:41%;width:19%;height:38%;animation-delay:-.18s}

function rankFight(win){
 const r=SAVE.rr,from=r.i,wasPlaced=r.placed,p0=r.p|0;
 if(win)r.w=(r.w|0)+1;else r.l=(r.l|0)+1;
 let d=0;
 if(!r.placed){
  r.placed=true;
  const php=Math.max(0,S.p[0].hp),ouch=Math.max(0,MAXHP-Math.max(0,S.p[1].hp));
  const score=(win?3:0)+php+Math.round(ouch/2);
  r.i=Math.max(0,Math.min(5,Math.round(score/12*5)));
  r.p=Math.min(85,25+score*4);
 }else{
  const hp=Math.max(0,S.p[0].hp),ouch=Math.max(0,MAXHP-Math.max(0,S.p[1].hp));
  d=win?34+Math.min(18,hp*6):-(22-Math.min(10,ouch*2));
  r.p=(r.p|0)+d;
  while(r.p>=100&&r.i<RANKS.length-1){r.i++;r.p-=100}
  while(r.p<0&&r.i>0){r.i--;r.p+=100}
  r.p=Math.max(0,Math.min(100,r.p));
 }
 r.best=Math.max(r.best|0,r.i);
 const got=[];
 RTITLE.forEach(t=>{if(r.i>=t.i&&!r.unl.includes(t.i)){r.unl.push(t.i);r.title=t.t;SAVE.own[t.id]=true;got.push(t)}});
 save();
 return {from,to:r.i,placed:!wasPlaced,win,up:r.i-from,got,delta:d,p0,p1:r.p|0};
}

function score(a,me,en){
 const d=dist(me,en);
 if(a.atk){
  const lim=a.pull?5:a.lunge?(a.lunge>1?a.lunge:3)+a.range:a.range;if(d>lim)return S.gm=='bed'&&a.dmg&&dist(me,S.beds[0])<=a.range&&S.beds[0].alive?9:0;
  if(!a.dmg)return d>2?4:0;
  if(en.shield&&!a.pierce)return 1;
  return a.dmg*10+(a.pierce&&en.shield?10:0)+(a.web?5:0);
 }
 if(a.shield)return me.lock>0?0:5;
 if(a.heal)return me.hp>=MAXHP?0:me.hp<=5?12:3;
 if(a.stance)return 3;
 if(a.buff)return d<=7?4:1;
 if(a.water)return me.burn>0?11:0;
 if(a.boom)return d<=5&&d>1?a.boom*8:0;
 if(a.lava)return d<=4?9+(a.web?3:0):0;
 if(a.place)return d<=5&&!webAt(en)?4:0;
 return 0;
}
function pick(i){
 const me=S.p[i],en=S.p[1-i],h=me.hand;let best=null;
 for(let a=0;a<h.length;a++)for(let c=a;c<h.length;c++)
  for(const act of actions(h[a],c>a?h[c]:undefined)){if(!!act.cons!=!!S.pickCons)continue;
   const sc=score(act,me,en);if(sc>0&&(!best||sc>best.sc))best={act,idx:c>a?[a,c]:[a],sc};
  }
 return best;
}
