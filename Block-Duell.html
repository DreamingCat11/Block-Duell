  return a.dmg*10+(a.pierce&&en.shield?10:0)+(a.web?5:0);
 }
 if(a.shield)return me.lock>0?0:5;
 if(a.heal)return me.hp>=MAXHP?0:me.hp<=5?12:3;
 if(a.stance)return 3;

 let bar='';

 else if(can&&S.sel.length){

 }else if(can)bar='<span>Tippe 1 Karte an, oder 2 Karten für eine Kombo.</span>';

 h+=`</div><div class="right"><div class="bar">${bar}</div>`;
 h+='<div class="hand">'+S.p[hi].hand.map((id,i)=>{const c=C[id];
  const st=[`Klasse ${c.cls}`,c.r?`Range ${c.r}`:null,c.d?`Damage ${c.d} ♥`:null,c.k?`Konter ${c.k}`:null].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
  return `<button class="card k-${c.cls} w-${id}${dl?' deal':''}${S.sel.includes(i)&&S.cur==hi?' sel':''}" style="--i:${i}" data-a="card" data-i="${i}"${can&&S.cur==hi?'':' disabled'}><h3>${c.n}</h3><div class="ic"><span>${IC[id]}</span></div><div class="s">${st}</div><p>${c.b}</p></button>`}).join('')+'</div>';
 h+='</div></div>';
 if(S.over>=0&&!S.paid){S.paid=1;setMode('calm');S.gain=S.mode=='cpu'?(S.over==0?25:0):15;SAVE.em+=S.gain;S.xp0=Math.min(BP.lv*BP.step,SAVE.bxp|0);const bpr=bpAdd(S.mode=='cpu'?(S.over==0?80:25):45);S.xp1=Math.min(BP.lv*BP.step,SAVE.bxp|0);S.bpup=!!bpr.up;save()}
 const finOk=S.over>=0&&!S.finDone&&(S.mode!='cpu'||S.over==0)&&!!SAVE.fin&&FIN.some(x=>x.id==SAVE.fin);
 const ready=bpReady(),x0=Math.min(BP.lv*BP.step,Math.max(0,S.xp0|0)),x1=Math.min(BP.lv*BP.step,Math.max(x0,S.xp1|0)),xlv0=Math.min(BP.lv,Math.floor(x0/BP.step)+1),xp0=xlv0>=BP.lv?100:(x0-(xlv0-1)*BP.step)/BP.step*100;
 if(S.over>=0&&!finOk)h+=`<div class="ov">${Array.from({length:24},(_,k)=>`<i class="cf" style="left:${k*4.2}%;animation-delay:${(k%6)*.25}s;background:hsl(${k*47},90%,60%)"></i>`).join('')}<div class="win"><h2>${nmz(S.over)} ${S.mode=='cpu'&&S.over==0?'gewinnst':'gewinnt'}!</h2><p class="wingain">${S.gain?'+'+S.gain+' Emeralds':''}</p><div class="xpbox"><div class="xptop"><span>BATTLE PASS · LEVEL <b id="xplv">${xlv0}</b></span><span id="xpxp">${Math.round(xlv0>=BP.lv?BP.step:x0-(xlv0-1)*BP.step)} / ${BP.step} XP</span></div><div class="xpbar"><i id="xpf" style="width:${xp0.toFixed(1)}%"></i></div><div class="xpmsg" id="xpmsg">+${x1-x0} XP${ready?` · ${ready} Belohnung${ready>1?'en':''} bereit`:''}</div></div><div class="winrow"><button class="pri" data-a="pass">${ready?'Belohnungen abholen':'Zum Battle Pass'}</button><button data-a="new">Nochmal spielen</button></div></div></div>`;
 else if(S.over<0&&S.pick!=null)h+=`<div class="ov"><div class="pk"><h2>${nmz(S.pick)}: Wähle eine Karte</h2><div class="pg">${Object.keys(C).filter(k=>!CFG.off[k]).map(k=>`<button data-a="pk" data-id="${k}"><span>${IC[k]}</span>${C[k].n}</button>`).join('')}</div></div></div>`;
 else if(S.over<0&&S.cover)h+=`<div class="ov"><div><h2>${nmz(S.cur)} ist dran</h2><p>Gib das Gerät weiter und deck deine Hand auf.</p><button data-a="show">Hand aufdecken</button></div></div>`;

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='pvp'||a=='pvb'){CFG.mode=a=='pvp'?'2p':'cpu';SCR='setup';return render()}
 if(a=='back'){SCR='menu';return render()}
 if(a=='map'){CFG.map=t.dataset.id;return render()}
 if(a=='gm'){CFG.gm=t.dataset.id;return render()}
 if(a=='shop'){SCR='shop';return render()}
 if(a=='pass'){SCR='pass';return render()}
 if(a=='bpbuy'){if(!SAVE.bpp&&SAVE.em>=BP.cost){SAVE.em-=BP.cost;SAVE.bpp=true;save()}return render()}
 if(a=='bpclaim'){const r=t.dataset.all?bpClaimAll():bpClaimOne(+t.dataset.lv,t.dataset.t);save();render();if(r&&r.items&&r.items.length)bpReveal(r.items,r.em);else if(r&&r.em)toast('+'+r.em+' Emeralds');return}
 if(a=='tab'){TAB=t.dataset.id;return render()}
 if(a=='wsel'){WSEL=t.dataset.id;return render()}
 if(a=='cheat')return cheatWin();
 if(a=='cx')return redeem();
 if(a=='cclose'){const e=document.getElementById('ch');if(e)e.remove();return render()}
 if(a=='case')return openCase(t.dataset.id);
 if(a=='cc'){const e=document.getElementById('cs');if(e)e.remove();return render()}
 if(a=='eq'){const it=ITEMS.find(x=>x.id==t.dataset.id);if(it.k=='w'){SAVE.eq[it.w]=SAVE.eq[it.w]==it.id?null:it.id;applySkins()}else SAVE.pl=it.id;save();return render()}
 if(a=='fin'){const id=t.dataset.id;SAVE.fin=id&&SAVE.fin!=id?id:null;save();return render()}
 if(a=='tog'){CFG.off[t.dataset.id]=!CFG.off[t.dataset.id];return render()}
 if(a=='allon'){CFG.off={};return render()}
 if(a=='hp'){CFG.hearts=+t.dataset.v;return render()}
 if(a=='rift'){CFG.rift=!CFG.rift;return render()}
 if(a=='start'){if(deckSize()<12)return;MAXHP=CFG.hearts;SCR='game';return newGame(CFG.mode)}
 if(a=='pk'){S.p[S.pick].hand.push(t.dataset.id);S.pick++;
  if(S.pick==1&&S.mode=='cpu'){const e=Object.keys(C).filter(x=>!CFG.off[x]);S.p[1].hand.push(e[Math.floor(Math.random()*e.length)]);S.pick=null;L('Die CPU hat sich auch eine Karte genommen.')}
  else if(S.pick>1)S.pick=null;
  S.deal=S.pick==null&&S.mode=='cpu';return render()}
 if(a=='new')return newGame();
 if(a=='menu'){SCR='menu';return render()}
 if(a=='show'){S.cover=false;S.deal=true;return render()}
 if(a=='snd'){MUTE=!MUTE;return render()}
 if(!canPlay())return;
 const me=S.p[S.cur];
 if(a=='card'){const i=+t.dataset.i,k=S.sel.indexOf(i);S.tgt=null;if(k>=0)S.sel.splice(k,1);else{S.sel.push(i);if(S.sel.length>2)S.sel.shift()}S.msg='';render()}
 else if(a=='act'){
  const act=actions(...S.sel.map(i=>me.hand[i]))[+t.dataset.k];
  if(act.jump||act.place){S.tgt={act,idx:S.sel.slice()};render()}else finish(doExec(S.cur,S.sel.slice(),act));
 }
 else if(a=='cancel'){S.tgt=null;render()}
 else if(a=='end')endTurn();
 else if(a=='cell'){
  const x=+t.dataset.x,y=+t.dataset.y;
  if(S.tgt){if(tgtOK(x,y))finish(doExec(S.cur,S.tgt.idx,S.tgt.act,{x,y}))}
  else if(!S.moved&&dist(me,{x,y})==1&&!occ(x,y)&&!isV(x,y)){move(S.cur,x,y);S.msg='';render();after()}
 }
});
let MUS=0,MON=false,MG=null,BG=null,MMODE='calm';
function vol(){if(!MG)return;const t=AC.currentTime;MG.gain.setTargetAtTime(MON&&MMODE=='calm'?.5:0,t,.15);BG.gain.setTargetAtTime(MON&&MMODE=='battle'?.55:0,t,.15)}
function setMode(m){MMODE=m;vol()}
function startMusic(){
 if(MUS)return;MUS=1;AC=AC||new AudioContext();
 const ac=AC,mg=ac.createGain();mg.gain.value=0;MG=mg;const bg=ac.createGain();bg.gain.value=0;BG=bg;
 const rv=ac.createConvolver(),n=Math.floor(ac.sampleRate*3.2),buf=ac.createBuffer(2,n,ac.sampleRate);
 for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
 rv.buffer=buf;const wet=ac.createGain();wet.gain.value=.55;mg.connect(ac.destination);mg.connect(rv);bg.connect(ac.destination);bg.connect(rv);rv.connect(wet);wet.connect(ac.destination);
 const f=m=>440*Math.pow(2,(m-69)/12);
 const note=(m,t,dur,vol,type)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05)};
 const pad=(m,t,dur)=>{[0,.07].forEach(dt=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f(m)*(1+dt/50);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.1)})};
 const P=[[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]],[[45,57,60,64],[43,55,59,62],[41,53,57,60],[40,52,56,59]]];
 let t=ac.currentTime+.3,bar=0,prog=P[0];const beat=1.15;
 const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const nz=(t,d,v,hp)=>{const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();s.buffer=nb;fl.type='highpass';fl.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(bg);s.start(t);s.stop(t+d+.02)};
 const kk=t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(bg);o.start(t);o.stop(t+.24)};
 const bn=(m,t,d,v,ty)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bg);o.start(t);o.stop(t+d+.02)};
 const BR=[40,36,43,38],BA=[[64,67,71,76],[60,64,67,72],[62,67,71,74],[62,66,69,74]];
 let bt=ac.currentTime+.3,bb=0;
 setInterval(()=>{
  if(!MON||ac.state!='running'||MMODE!='battle'){bt=Math.max(bt,ac.currentTime+.2);return}
  while(bt<ac.currentTime+.8){
   const ci=Math.floor(bb/16)%4,s=bb%16,r=BR[ci],a=BA[ci];
   if(s%4==0)kk(bt);
   if(s==4||s==12)nz(bt,.16,.3,1500);
   if(s%2==0){nz(bt,.04,.08,7000);bn(r,bt,.2,.1,'sawtooth')}
   bn(a[[0,1,2,3,2,1,2,3][s%8]],bt,.14,.05,'square');
   if(s==0)bn(r+24,bt,1.5,.04,'triangle');
   if(bb%64>=56&&s%2==0)bn(60+(bb%64-56)*2,bt,.1,.05,'square');
   bt+=.1;bb++;
  }
 },120);
 setInterval(()=>{
  if(!MON||ac.state!='running'||MMODE!='calm'){t=Math.max(t,ac.currentTime+.2);return}
  while(t<ac.currentTime+1.2){
   if(bar%4==0)prog=P[Math.random()<.5?0:1];
   const ch=prog[bar%4];
   ch.forEach(m=>pad(m,t,beat*4.4));note(ch[0]-12,t,beat*3,.14,'sine');
   for(let k=0;k<8;k++){if(Math.random()<.6){const m=ch[Math.floor(Math.random()*ch.length)]+12*(1+(Math.random()<.35?1:0));note(m,t+k*beat/2+Math.random()*.02,3,.09+Math.random()*.05)}}
   t+=beat*4;bar++;
  }
 },200);
}
function toggleMusic(){MON=!MON;startMusic();if(AC.resume)AC.resume();vol();document.getElementById('mus').textContent='Musik: '+(MON?'AN':'AUS')}
const mb=document.createElement('button');mb.id='mus';mb.textContent='Musik: AUS';mb.onclick=e=>{e.stopPropagation();toggleMusic()};document.body.appendChild(mb);
document.addEventListener('click',()=>{if(!MUS)toggleMusic()},{once:true});
applySkins();menu();
